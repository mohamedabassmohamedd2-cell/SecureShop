{% extends "base.html" %}
{% block title %}{{ product.name }} · SecureShop{% endblock %}
{% block content %}
<article class="product-detail">
  <p><a href="{{ url_for('shop.index') }}">← Back to products</a></p>
  <h1>{{ product.name }}</h1>
  <p class="card-category">{{ product.category|capitalize }}</p>
  <p class="card-price">{{ product.price|money }} credit</p>
  <p>{{ product.description }}</p>
  <p>In stock: {{ product.stock }}</p>
  <form method="post" action="{{ url_for('shop.cart_add') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="product_id" value="{{ product.id }}">
    <div class="row">
      <label for="qty">Quantity</label>
      <input id="qty" type="number" name="quantity" value="1" min="1" max="{{ product.stock }}" required>
    </div>
    <button type="submit" class="btn btn-primary" {% if product.stock <= 0 %}disabled{% endif %}>Add to cart</button>
  </form>
</article>
{% endblock %}
