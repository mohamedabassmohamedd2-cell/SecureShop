{% extends "base.html" %}
{% block title %}Create account · SecureShop{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" type="text" name="username" value="{{ username or '' }}" required autocomplete="username">
    <label for="full_name">Full name</label>
    <input id="full_name" type="text" name="full_name" value="{{ full_name or '' }}" autocomplete="name">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    <label for="password">Password <small>(at least 12 characters)</small></label>
    <input id="password" type="password" name="password" required autocomplete="new-password">
    <button type="submit" class="btn btn-primary">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
