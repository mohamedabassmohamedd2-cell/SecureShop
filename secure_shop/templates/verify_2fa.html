{% extends "base.html" %}
{% block title %}Two-factor authentication · SecureShop{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Two-factor authentication</h1>
  <p>Enter the 6-digit code from your authenticator app.</p>
  <form method="post" action="{{ url_for('auth.verify_2fa') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="code">One-time code</label>
    <input id="code" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
    <button type="submit" class="btn btn-primary">Verify</button>
  </form>
</div>
{% endblock %}
